[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Generic classes/functions keep the TypeVar style for readability.
ignore = ["UP046", "UP047"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecation notices from third-party test tooling, not from our code.
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:fastapi.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
