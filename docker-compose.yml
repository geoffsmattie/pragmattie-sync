# One command starts the whole stack:  docker compose up --build
#   Web app  -> http://localhost:5173
#   API docs -> http://localhost:8000/docs
#   MySQL    -> localhost:3307 (from your PC; containers use db:3306)

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # 3307 on your PC avoids clashing with a local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      WATCHFILES_FORCE_POLLING: "true"   # reliable auto-reload on Windows
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"        # reliable hot reload on Windows
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  mysql-data:
